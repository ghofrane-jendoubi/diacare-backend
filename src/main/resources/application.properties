spring.application.name=diaCare-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Connexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/diacare_dbbb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Ne pas sp�cifier de dialecte manuellement ? laisse Hibernate le d�terminer
# spring.jpa.properties.hibernate.dialect=...

# Pool de connexions (�vite les timeouts)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.initialization-fail-timeout=-1

server.port=8090
